# Nginx site config for Rapport Chat — production single-host deployment.
#
# Serves the React SPA from /var/www/rapport/frontend, proxies all /api
# requests to the Node.js backend, and forwards Socket.IO upgrades so the
# WebSocket handshake succeeds behind the reverse proxy.
#
# Prerequisites:
#   - Certbot / Let's Encrypt TLS certificate for your domain.
#   - Node.js server running on localhost:4000 managed by PM2.
#   - Frontend build files copied to /var/www/rapport/frontend.
#
# To install:
#   sudo cp rapport.conf /etc/nginx/sites-available/rapport
#   sudo ln -s /etc/nginx/sites-available/rapport /etc/nginx/sites-enabled/rapport
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.example.com;
    # Redirect all HTTP to HTTPS once the certificate is in place.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/rapport/frontend;
    index index.html;

    # ---------------------------------------------------------------------------
    # Static asset caching
    # Cache JS/CSS/image build artefacts for one year.  Vite appends content
    # hashes to filenames so stale cache entries are never served after a redeploy.
    # ---------------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Service worker and web manifest must never be cached so the browser picks
    # up updates on the next page load.
    # ---------------------------------------------------------------------------
    location ~* (?:sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # REST API reverse proxy
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------------
    # Socket.IO WebSocket proxy
    # The upgrade and connection headers must be forwarded for the WebSocket
    # handshake to succeed behind Nginx.
    # ---------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ---------------------------------------------------------------------------
    # SPA fallback — serve index.html for any path the React Router handles.
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

