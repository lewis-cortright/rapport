<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff8300" />
    <title>Rapport — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #fff;
        color: #111827;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      .badge {
        width: 4rem; height: 4rem;
        border-radius: 1rem;
        background: #ff8300;
        color: #fff;
        font-size: 2.25rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 1.5rem; }
      p  { color: #6b7280; max-width: 28rem; line-height: 1.6; }
      a  { color: #ff8300; font-weight: 600; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <div class="badge">R</div>
    <h1>You're offline</h1>
    <p>
      Rapport needs a network connection to load. Check your Wi-Fi or mobile
      data, then <a href="/app">try again</a>.
    </p>
  </body>
</html>
